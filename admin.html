<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号管理</title>
  <style>
    :root { --bg:#0b0f16; --card:#151b27; --line:#2a3344; --text:#e8edf5; --muted:#8b97ab; --blue:#4c8dff; --red:#f05363; --gold:#f5c14a; --green:#20c997; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:20px; }
    .wrap { max-width:1280px; margin:0 auto; }
    a { color:var(--blue); }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:var(--muted); font-size:13px; }
    form, .bar, .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
    form { display:grid; grid-template-columns: 1.2fr 1.2fr 1fr auto; gap:10px 12px; align-items:end; }
    form .err { grid-column: 1 / -1; margin:0; }
    label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px; }
    input, select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0f141d; color:var(--text); }
    button { border:0; border-radius:8px; padding:8px 12px; background:var(--blue); color:#fff; cursor:pointer; font-size:12px; white-space:nowrap; }
    button.danger { background:var(--red); }
    button.ghost { background:#223049; }
    button.warn { background:#8a5a12; }
    button[disabled] { opacity:.45; cursor:not-allowed; }
    .table-wrap { overflow:auto; padding:0; }
    table { border-collapse:collapse; width:100%; min-width:1080px; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:12px; vertical-align:middle; }
    th { position:sticky; top:0; background:#1a2230; color:var(--muted); font-weight:600; }
    td select { width:auto; min-width:96px; margin:0; }
    .err { color:var(--red); min-height:18px; }
    .muted { color:var(--muted); }
    #who { font-size:13px; color:var(--gold); margin:0 0 8px; }
    .ok { color:var(--green); }
    .bad { color:var(--red); }
    .ops { display:flex; flex-wrap:wrap; gap:6px; }
    .ops button { margin:0; padding:5px 8px; }
    .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    .bar .f { min-width:160px; flex:1; }
    .bar button { margin:0; }
    .count { color:var(--muted); font-size:12px; margin-left:auto; align-self:center; }
    .pw { max-width:140px; word-break:break-all; }
    .geo { max-width:180px; color:var(--muted); }
    @media (max-width: 800px) {
      body { padding:12px; }
      form { grid-template-columns: 1fr; }
      .bar { align-items:stretch; }
      .bar .f, .bar button, .count { width:100%; margin-left:0; }
      th, td { padding:8px; font-size:11px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>账号管理</h1>
  <p id="who"></p>
  <p><a href="/board">返回看板</a> · 管理员可改角色、续期、清空有效期、批量删除。到期账号不会自动删除。SVIP 只能添加账号，不能改有效期。</p>
  <form id="add">
    <div>
      <label>新账号</label>
      <input id="user" required placeholder="手机号或用户名" />
    </div>
    <div>
      <label>密码</label>
      <input id="pass" type="password" required />
    </div>
    <div>
      <label>角色</label>
      <select id="role">
        <option value="vip">VIP（仅看板）</option>
        <option value="svip">SVIP（可加号，不能续期）</option>
        <option value="admin">管理员（永久、全权限）</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label>
      <button type="submit">添加用户</button>
    </div>
    <div class="err" id="err"></div>
  </form>
  <div class="bar" id="filterBar">
    <div class="f">
      <label>状态筛选</label>
      <select id="filterStatus">
        <option value="all">全部状态</option>
        <option value="ok">正常</option>
        <option value="expired">已到期</option>
      </select>
    </div>
    <div class="f">
      <label>角色筛选</label>
      <select id="filterRole">
        <option value="all">全部角色</option>
        <option value="admin">管理员</option>
        <option value="svip">SVIP</option>
        <option value="vip">VIP</option>
      </select>
    </div>
    <button type="button" id="selAll">全选当前筛选</button>
    <button type="button" id="selNone">取消全选</button>
    <button type="button" class="danger" id="batchDel">批量删除所选</button>
    <span class="count" id="count"></span>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th></th>
        <th>账号</th>
        <th>角色</th>
        <th>状态</th>
        <th>开启时间</th>
        <th>有效期至</th>
        <th>最后登录</th>
        <th>登录 IP</th>
        <th>登录地点</th>
        <th>当前密码</th>
        <th>有效期操作</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <script>
    let ME = null;
    let USERS = [];
    function roleLabel(role) {
      return { admin: "管理员", svip: "SVIP", vip: "VIP", user: "VIP" }[role] || role;
    }
    function fmt(ts) {
      if (!ts) return "—";
      return new Date(Number(ts) * 1000).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
    }
    function fmtExp(u) {
      if (u.role === "admin" || u.permanent) return "永久";
      if (!u.expires_at) return "永久";
      return fmt(u.expires_at);
    }
    function filtered() {
      const st = document.getElementById("filterStatus").value;
      const role = document.getElementById("filterRole").value;
      return USERS.filter(u => {
        if (st === "ok" && u.expired) return false;
        if (st === "expired" && !u.expired) return false;
        if (role !== "all" && u.role !== role) return false;
        return true;
      });
    }
    function render() {
      const canExpire = ME && ME.role === "admin";
      const list = filtered();
      document.getElementById("count").textContent = "当前筛选 " + list.length + " / 共 " + USERS.length + " 个账号";
      document.getElementById("rows").innerHTML = list.map(u => {
        const roleDisabled = (!canExpire || u.locked) ? "disabled" : "";
        const pwText = canExpire ? (u.password_hidden ? "仅哈希，重置后可见" : (u.password || "—")) : "—";
        const geoText = (u.last_geo || "—");
        const ext = canExpire && u.role !== "admin" ? `
          <div class="ops">
            <button data-days="${u.user}" data-n="1">+1天</button>
            <button data-days="${u.user}" data-n="15">+15天</button>
            <button data-days="${u.user}" data-n="30">+30天</button>
            <button class="ghost" data-perm="${u.user}">永久</button>
            <button class="warn" data-clear="${u.user}">清空有效期</button>
          </div>` : `<span class="muted">${u.role === "admin" ? "管理员永久" : "无权改有效期"}</span>`;
        return `<tr>
          <td>${u.self || u.locked ? "" : `<input type="checkbox" data-pick="${u.user}" />`}</td>
          <td>${u.user}${u.self ? " <span class=\"muted\">(当前)</span>" : ""}${u.locked ? " <span class=\"muted\">(锁死)</span>" : ""}</td>
          <td>
            <select data-role="${u.user}" ${roleDisabled}>
              <option value="vip" ${u.role === "vip" ? "selected" : ""}>VIP</option>
              <option value="svip" ${u.role === "svip" ? "selected" : ""}>SVIP</option>
              <option value="admin" ${u.role === "admin" ? "selected" : ""}>管理员</option>
            </select>
          </td>
          <td class="${u.expired ? "bad" : "ok"}">${u.status}</td>
          <td>${fmt(u.created_at)}</td>
          <td>${fmtExp(u)}</td>
          <td>${u.last_login ? fmt(u.last_login) : "从未登录"}</td>
          <td>${u.last_ip || "—"}</td>
          <td class="geo">${geoText}</td>
          <td class="pw">${pwText}</td>
          <td>${ext}</td>
          <td>${!canExpire || u.self || u.locked ? "" : `<button class="danger" data-del="${u.user}">删除</button>`}</td>
        </tr>`;
      }).join("");
    }
    async function load() {
      const meR = await fetch("/api/me", { credentials: "same-origin" });
      if (meR.status === 401 || meR.status === 403) { location.href = "/login"; return; }
      ME = await meR.json();
      document.getElementById("who").textContent = "已登录权限：" + roleLabel(ME.role) + " · " + ME.user;
      const roleSel = document.getElementById("role");
      if (ME.role !== "admin") {
        roleSel.innerHTML = '<option value="vip">VIP（仅看板）</option>';
        document.getElementById("batchDel").hidden = true;
        document.getElementById("selAll").hidden = ME.role !== "admin";
      }
      const r = await fetch("/api/users", { credentials: "same-origin" });
      if (r.status === 401 || r.status === 403) { location.href = "/login"; return; }
      const j = await r.json();
      USERS = j.users || [];
      render();
    }
    document.getElementById("filterStatus").onchange = render;
    document.getElementById("filterRole").onchange = render;
    document.getElementById("selAll").onclick = () => {
      document.querySelectorAll("[data-pick]").forEach(el => { el.checked = true; });
    };
    document.getElementById("selNone").onclick = () => {
      document.querySelectorAll("[data-pick]").forEach(el => { el.checked = false; });
    };
    document.getElementById("batchDel").onclick = async () => {
      const names = [...document.querySelectorAll("[data-pick]:checked")].map(el => el.dataset.pick);
      if (!names.length) { alert("请先勾选要删除的账号"); return; }
      if (!confirm("批量删除 " + names.length + " 个账号？到期账号可不清，账号不会自动删除。此操作不可恢复。")) return;
      const r = await fetch("/api/users/batch-delete", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ users: names })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { alert(j.error || "批量删除失败"); return; }
      if (j.skipped && j.skipped.length) alert("已删除 " + (j.deleted || []).length + " 个，跳过：" + j.skipped.join("、"));
      load();
    };
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      document.getElementById("err").textContent = "";
      const r = await fetch("/api/users", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value.trim(),
          pass: document.getElementById("pass").value,
          role: document.getElementById("role").value
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { document.getElementById("err").textContent = j.error || "失败"; return; }
      document.getElementById("user").value = "";
      document.getElementById("pass").value = "";
      load();
    };
    document.getElementById("rows").onclick = async (e) => {
      const del = e.target.closest("[data-del]");
      if (del) {
        if (!confirm("删除账号 " + del.dataset.del + "？其自选也会丢掉。到期用户可不清账号，只清有效期。")) return;
        await fetch("/api/users?user=" + encodeURIComponent(del.dataset.del), { method: "DELETE", credentials: "same-origin" });
        return load();
      }
      const daysBtn = e.target.closest("[data-days]");
      if (daysBtn) {
        const r = await fetch("/api/users", {
          method: "PATCH", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: daysBtn.dataset.days, add_days: Number(daysBtn.dataset.n) })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) alert(j.error || "续期失败");
        return load();
      }
      const perm = e.target.closest("[data-perm]");
      if (perm) {
        if (!confirm("将 " + perm.dataset.perm + " 设为永久可用？")) return;
        const r = await fetch("/api/users", {
          method: "PATCH", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: perm.dataset.perm, permanent: true })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) alert(j.error || "设置失败");
        return load();
      }
      const clr = e.target.closest("[data-clear]");
      if (clr) {
        if (!confirm("清空 " + clr.dataset.clear + " 的有效期？账号会保留并显示已到期，登录将提示账户已到期。")) return;
        const r = await fetch("/api/users", {
          method: "PATCH", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: clr.dataset.clear, clear_expiry: true })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) alert(j.error || "清空失败");
        return load();
      }
    };
    document.getElementById("rows").onchange = async (e) => {
      const sel = e.target.closest("select[data-role]");
      if (!sel || sel.disabled) return;
      const r = await fetch("/api/users", {
        method: "PATCH",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: sel.dataset.role, role: sel.value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) alert(j.error || "改角色失败");
      load();
    };
    load();
  </script>
</div>
</body>
</html>
